x-app-env: &app-env
  APP_NAME: ${APP_NAME:-"WhatsApp Bot"}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost:8000}
  # Traefik (Dokploy) ya termina TLS por afuera y manda HTTP plano al contenedor.
  # Sin esto, Caddy activa su HTTPS automático acá adentro también y entra en
  # loop de redirect (HTTP -> HTTPS -> HTTP -> ...).
  SERVER_NAME: ":80"
  DB_CONNECTION: pgsql
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:-chatbot}
  DB_USERNAME: ${DB_USERNAME:-postgres}
  DB_PASSWORD: ${DB_PASSWORD}
  QUEUE_CONNECTION: redis
  REDIS_CLIENT: predis
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT:-6379}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_CHAT_MODEL: ${DEEPSEEK_CHAT_MODEL:-deepseek-chat}
  DEEPSEEK_VISION_MODEL: ${DEEPSEEK_VISION_MODEL:-deepseek-vl}
  DEEPSEEK_EMBEDDING_MODEL: ${DEEPSEEK_EMBEDDING_MODEL:-deepseek-embedding}
  WHATSAPP_CLOUD_API_BASE_URL: ${WHATSAPP_CLOUD_API_BASE_URL:-https://graph.facebook.com/v21.0}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
  WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    environment: *app-env
    volumes:
      - storage_data:/app/storage/app/public
    networks:
      - dokploy-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot_worker
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=120
    environment: *app-env
    volumes:
      - storage_data:/app/storage/app/public
    networks:
      - dokploy-network

volumes:
  storage_data:

networks:
  dokploy-network:
    external: true
